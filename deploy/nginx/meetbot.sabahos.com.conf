# SABAH Meetbot — nginx vhosts.
#
#   sudo cp deploy/nginx/meetbot.sabahos.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/meetbot.sabahos.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d meetbot.sabahos.com -d attendee.sabahos.com   # adds :443 + HTTP→HTTPS redirect
#
# DNS first: A records meetbot.sabahos.com and attendee.sabahos.com → this server's public IP.

# meetbot.sabahos.com → Meetbot admin (/admin/) and REST API (/api/), container port 127.0.0.1:8100
server {
    listen 80;
    listen [::]:80;
    server_name meetbot.sabahos.com;

    client_max_body_size 2m;

    # Attendee calls this over the internal docker network; nothing outside needs it.
    location /webhooks/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # /api/meetings/<id>/ask/ waits for Claude
    }
}

# attendee.sabahos.com → Attendee dashboard (bot debugging, screenshots), 127.0.0.1:8101
server {
    listen 80;
    listen [::]:80;
    server_name attendee.sabahos.com;

    # Internal tool: uncomment to restrict to the office / VPN.
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
